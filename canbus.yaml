# 1. Intervall auf echte 1 Sekunde korrigieren für maximale Reaktionszeit








  - interval: 5s
    then:
      - lambda: |-
          twai_status_info_t status_info;
          
          // Daten direkt vom ESP32-Chip abrufen
          if (twai_get_status_info(&status_info) == ESP_OK) {
            
            // Die Zahl des Zustands (0-3) in lesbaren Text übersetzen
            std::string state_text = "UNBEKANNT";
            if (status_info.state == TWAI_STATE_STOPPED)     state_text = "GESTOPPT";
            if (status_info.state == TWAI_STATE_RUNNING)     state_text = "AKTIV (OK)";
            if (status_info.state == TWAI_STATE_BUS_OFF)     state_text = "BUS-OFF (ABGESCHALTET)";
            if (status_info.state == TWAI_STATE_RECOVERING)  state_text = "RECOVERY (STARTET NEU)";
            
            // Ausgabe im ESPHome-Log als "Bold/Cyan" Info-Meldung
            ESP_LOGI("can_diagnose", "--------------------------------");
            ESP_LOGI("can_diagnose", "CAN-Bus Zustand: %s", state_text.c_str());
            ESP_LOGI("can_diagnose", "Nachrichten im Puffer: %d", status_info.msgs_to_tx);
            ESP_LOGI("can_diagnose", "Hardware Sende-Fehler: %d", status_info.tx_error_counter);
            ESP_LOGI("can_diagnose", "--------------------------------");
          } else {
            ESP_LOGE("can_diagnose", "Fehler: Hardware-Status konnte nicht gelesen werden!");
          }



# Das Intervall prüft nur den Zustand und startet bei Bedarf das Skript

  - interval: 1s
    then:
      - lambda: |-
          #include "driver/twai.h"
          twai_status_info_t status_info;
          
          if (twai_get_status_info(&status_info) == ESP_OK) {
            
            // 1. Numerische Sensorwerte schreiben
            id(can_tx_error_counter).publish_state(status_info.tx_error_counter);
            id(can_msgs_to_tx).publish_state(status_info.msgs_to_tx);
            
            // 2. Buszustand als Text übersetzen und schreiben
            switch (status_info.state) {
              case TWAI_STATE_STOPPED:
                id(can_bus_state).publish_state("Gestoppt");
                break;
              case TWAI_STATE_RUNNING:
                id(can_bus_state).publish_state("Aktiv");
                break;
              case TWAI_STATE_BUS_OFF:
                id(can_bus_state).publish_state("Bus-Off (Fehler)");
                break;
              case TWAI_STATE_RECOVERING:
                id(can_bus_state).publish_state("Wiederherstellung");
                break;
              default:
                id(can_bus_state).publish_state("Unbekannt");
                break;
            }

            // Ihre bestehende Recovery-Logik
            if ((status_info.state == TWAI_STATE_BUS_OFF || status_info.state == TWAI_STATE_STOPPED) && !id(can_recovery_script).is_running()) {
              id(can_recovery_script).execute();
            }
          }


# Hier läuft die sichere, nicht-blockierende Ablaufsteuerung
script:
  - id: can_recovery_script
    mode: single
    then:
      - logger.log: "TWAI Bus-Off erkannt! Starte Recovery-Sequenz..."
      
      # 1. Warte 1 Sekunde (nicht-blockierend)
     # - delay: 1s
      
      # 2. Recovery initiieren
      - lambda: |-
            twai_initiate_recovery();
      # 3. Warte 2 Sekunden (nicht-blockierend)
      - delay: 4s
      
      # 4. TWAI Treiber wieder starten
      - lambda: |-
            twai_start();

      - delay: 3s


