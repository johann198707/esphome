  # 1. Der Live-Puffer-Monitor
    on_value_range:
      - above: 40
        then:
          - lambda: |-
              // Puffer radikal leeren, um Platz für neue Daten zu machen
              if (twai_clear_transmit_queue() == ESP_OK) {
                ESP_LOGW("can_auto", "Puffer-Limit überschritten (>40)! Sende-Puffer wurde automatisch bereinigt.");
                
                // Den Statistik-Zähler um 1 erhöhen
                auto current_clears = id(can_puffer_resets).get_raw_state();
                int new_count = (isnan(current_clears) ? 0 : (int)current_clears) + 1;
                id(can_puffer_resets).publish_state(new_count);
              }

